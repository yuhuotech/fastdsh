<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>FastDSH</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1e1f24; color: #e6e6e6; }
    .card { text-align: center; max-width: 520px; padding: 32px; }
    .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid #444; border-top-color: #4d9fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p { color: #9a9aa0; font-size: 13px; line-height: 1.6; word-break: break-all; }
    button { margin: 6px 4px 0; padding: 8px 20px; border: none; border-radius: 6px; background: #4d9fff; color: #fff; font-size: 13px; cursor: pointer; }
    button.secondary { background: #3a3b41; }
    #error { display: none; }
  </style>
</head>
<body>
  <div class="card" id="loading">
    <div class="spinner"></div>
    <h1>Starting DeepSeek Harness…</h1>
    <p>The first launch may take a moment.</p>
  </div>
  <div class="card" id="error">
    <h1>Harness failed to start</h1>
    <p id="detail"></p>
    <button onclick="window.fastdsh.retry()">Retry</button>
    <button class="secondary" onclick="window.fastdsh.openLog()">View Log</button>
  </div>
  <script>
    const match = location.hash.match(/^#error=(.*)$/)
    if (match) {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('error').style.display = 'block'
      document.getElementById('detail').textContent = decodeURIComponent(match[1])
    }
  </script>
</body>
</html>
