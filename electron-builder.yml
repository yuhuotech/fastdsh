appId: com.fastdsh.app
productName: FastDSH
copyright: Copyright © 2026

# asar must stay OFF: the Harness child is a plain Node process forked via
# utilityProcess and cannot read files inside an asar archive.
asar: false

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - resources/**
  - package.json
  - "!**/*.map"
  # dsh resolves part of its runtime through npm peer dependencies (e.g.
  # dsh-app-boot peers on cordis-plugin-group, dsh-bash-local, dsh-sandbox…).
  # electron-builder's npm collector drops peer-only packages, so
  # force-include them here. Everything under node_modules/@deepseek-ai is
  # runtime code — npm never installs devDependencies of dependencies —
  # and platform-scoped optional natives are only present when npm installed
  # them for the build host/target, so this stays platform-correct.
  - node_modules/@deepseek-ai/**
  - node_modules/@cfworker/**
  - node_modules/@emnapi/**

# dsh ships architecture-specific native modules; rebuild them for the
# target platform/arch during packaging. Always package ON the matching
# runner (macOS arm64 on Apple Silicon, etc.) so the binaries line up.
npmRebuild: true

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Code signing / notarization: set CSC_LINK, CSC_KEY_PASSWORD and
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID in CI secrets.
  notarize: false

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: FastDSH

linux:
  category: Development
  maintainer: yuhuotech
  target:
    - AppImage
    - deb
